variables:
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: normal

stages:
  - build
  - test
  - test-valgrind

.restrict: &restrict
  only:
    - master
    - /^.*-ci$/
    - web
  except:
    variables:
      - $CI_COMMIT_MESSAGE =~ /@skip-ci/

.job-debian:
  image: debian:stretch
  <<: *restrict

.build-debian:
  extends: .job-debian
  stage: build
  before_script:
    - env
    - apt-get update
    - apt-get install -y gcc make m4 pkg-config $DEBIAN_PKGS
  script:
    - env
    - make help
    - make third-party
    - make help
    - make

.check-debian:
  extends: .job-debian
  stage: test
  before_script:
    - env
    - apt-get update
    - apt-get install -y clang make m4 python pkg-config $DEBIAN_PKGS
  script:
    - env
    - make help
    - make third-party
    - make help
    - make
    - make check-ci

.check-valgrind-debian:
  extends: .job-debian
  stage: test
  before_script:
    - env
    - apt-get update
    - apt-get install -y clang make m4 python pkg-config valgrind $DEBIAN_PKGS
  script:
    - env
    - make help
    - make third-party
    - make help
    - make
    - make check-valgrind

build-debian-gcc:
  extends: .build-debian

build-debian-clang:
  extends: .build-debian
  variables:
    DEBIAN_PKGS: clang
    CC: clang



check-debian-gcc:
  extends: .check-debian

check-debian-clang:
  extends: .check-debian
  variables:
    DEBIAN_PKGS: clang
    CC: clang



check-debian-gcc:
  extends: .check-valgrind-debian

check-debian-clang:
  extends: .check-valgrind-debian
  variables:
    DEBIAN_PKGS: clang
    CC: clang
