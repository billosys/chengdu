# Triggers on pushing a tag matching v* (e.g. v0.1.0, or pre-release
# tags like v0.0.1-rc1). Calls the reusable build workflow
# (build-reusable.yml) — the SAME jobs and gates as every push/PR — and
# the publish job only runs if every leg is green: GH Actions skips a
# job whose `needs` dependency failed, so there is no path from a red
# build to a published release. The sequential structure IS the gate.
#
# Idempotency: re-running this workflow for a tag that already has a
# published GitHub Release FAILS at the `gh release create` step (a
# release for that tag already exists) — intentional. Releases are
# never silently overwritten by a re-run. To replace one, delete the
# release and the tag first, then push the tag again.
#
# Draft mode: this workflow publishes directly (arc-plan RQ1's default
# — the gates ARE the approval). To require an operator-promotion step
# instead, add `--draft` inside scripts/publish-release.sh's
# `gh release create` call; no workflow change is needed.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  call-build:
    uses: ./.github/workflows/build-reusable.yml

  publish:
    name: package + publish release
    needs: call-build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist-linux-x86_64-ubuntu-22.04-${{ needs.call-build.outputs.sha_short }}
          path: dist/linux-x86_64

      - uses: actions/download-artifact@v8
        with:
          name: dist-macos-arm64-macos-15-${{ needs.call-build.outputs.sha_short }}
          path: dist/macos-arm64

      - name: Restore executable bits (artifact download doesn't preserve them)
        run: chmod +x dist/linux-x86_64/pandaPI* dist/macos-arm64/pandaPI*

      - name: Package release
        run: ./scripts/package-release.sh "${{ github.ref_name }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.sh "${{ github.ref_name }}"
